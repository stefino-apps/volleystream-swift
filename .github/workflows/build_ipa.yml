name: Build IPA for Sideloading

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode 15.4
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Install Mint and XcodeGen
      run: |
        brew install mint
        mint install yonaskolb/xcodegen@2.39.0
      
    - name: Generate Xcode Project
      run: mint run yonaskolb/xcodegen@2.39.0 generate
      
    - name: Build Unsigned App
      run: |
        xcodebuild build \
          -project MiaApp.xcodeproj \
          -scheme MiaApp \
          -configuration Release \
          -sdk iphoneos \
          -destination "generic/platform=iOS" \
          -derivedDataPath DerivedData \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGN_ENTITLEMENTS="" \
          CODE_SIGNING_ALLOWED=NO
        
    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -r DerivedData/Build/Products/Release-iphoneos/*.app Payload/
        zip -r VolleyStreamPro.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VolleyStreamPro-Sideload
        path: VolleyStreamPro.ipa
