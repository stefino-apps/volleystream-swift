name: Build IPA for Sideloading

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Install XcodeGen
      run: brew install xcodegen
      
    - name: Generate Xcode Project
      run: xcodegen generate
      
    - name: Build Unsigned App
      run: |
        xcodebuild -project MiaApp.xcodeproj \
        -scheme MiaApp \
        -configuration Release \
        -sdk iphoneos \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY="" \
        CODE_SIGN_ENTITLEMENTS="" \
        CODE_SIGNING_ALLOWED=NO \
        build \
        CONFIGURATION_BUILD_DIR=$(pwd)/build
        
    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -r build/MiaApp.app Payload/
        zip -r VolleyStreamPro.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VolleyStreamPro-Sideload
        path: VolleyStreamPro.ipa
