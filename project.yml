name: MiaApp
options:
  bundleIdPrefix: com.sviluppo
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.0.0
  HaishinKit:
    url: https://github.com/shogo4405/HaishinKit.swift
    from: 1.8.0
targets:
  MiaApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        excludes:
          - ".github"
          - ".git"
          - "project.yml"
          - "Info.plist"
          - "Podfile"
          - "Podfile.lock"
          - "*.ps1"
          - "*.md"
          - "DerivedData"
          - "Payload"
          - ".spm"
          - "*.ipa"
          - "*.zip"
          - "screenshot_playstore_3d"
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseDatabase
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: HaishinKit
        product: HaishinKit
    settings:
      GENERATE_INFOPLIST_FILE: NO
      PRODUCT_NAME: VolleyStream Pro
      PRODUCT_BUNDLE_IDENTIFIER: com.sviluppo.MiaApp
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        NSCameraUsageDescription: "VolleyStream Pro richiede l'accesso alla fotocamera per trasmettere le partite in diretta."
        NSMicrophoneUsageDescription: "VolleyStream Pro richiede l'accesso al microfono per registrare l'audio durante la telecronaca."
        NSPhotoLibraryUsageDescription: "Per caricare loghi."
        NSPhotoLibraryAddUsageDescription: "Per salvare video."
        UILaunchStoryboardName: "LaunchScreen"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default Configuration"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        GIDClientID: "133245296621-4buscrif7ssggiqk4uj1qn9qegr13e15.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "com.googleusercontent.apps.133245296621-4buscrif7ssggiqk4uj1qn9qegr13e15"
