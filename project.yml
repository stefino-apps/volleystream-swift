name: MiaApp
options:
  bundleIdPrefix: com.sviluppo
  xcodeVersion: "16.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.0.0
  HaishinKit:
    url: https://github.com/shogo4405/HaishinKit.swift
    from: 1.8.0
schemes:
  MiaApp:
    build:
      targets:
        MiaApp: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  MiaApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        excludes:
          - ".github"
          - ".git"
          - "project.yml"
          - "Info.plist"
          - "Podfile"
          - "Podfile.lock"
          - "*.ps1"
          - "*.md"
          - "DerivedData"
          - "Payload"
          - ".spm"
          - "*.ipa"
          - "*.zip"
          - "screenshot_playstore_3d"
          - "*.html"
          - "fastlane"
    dependencies:
      - package: Firebase
        product: FirebaseDatabase
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: HaishinKit
        product: HaishinKit
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: VolleyStream Pro
        PRODUCT_BUNDLE_IDENTIFIER: com.sviluppo.MiaApp.MY76U9C456
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        DEVELOPMENT_TEAM: "MY76U9C456"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
    info:
      path: Info.plist
      properties:
        NSCameraUsageDescription: "VolleyStream Pro richiede l'accesso alla fotocamera per trasmettere le partite in diretta."
        NSMicrophoneUsageDescription: "VolleyStream Pro richiede l'accesso al microfono per registrare l'audio durante la telecronaca."
        NSPhotoLibraryUsageDescription: "Per caricare loghi."
        NSPhotoLibraryAddUsageDescription: "Per salvare video."
        UILaunchStoryboardName: "LaunchScreen"
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default Configuration"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).SceneDelegate"
        GIDClientID: "133245296621-4buscrif7ssggiqk4uj1qn9qegr13e15.apps.googleusercontent.com"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - "com.googleusercontent.apps.133245296621-4buscrif7ssggiqk4uj1qn9qegr13e15"
