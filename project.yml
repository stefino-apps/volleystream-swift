name: MiaApp
options:
  bundleIdPrefix: com.sviluppo
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0
targets:
  MiaApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        excludes:
          - ".github"
          - ".git"
          - "project.yml"
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseDatabase
      - package: Firebase
        product: FirebaseAuth
    info:
      path: Info.plist
